name: Android Release (debug, rolling latest)

# Publishes the debug APK to the rolling `latest` GitHub Release so it can
# be downloaded from the Releases page without opening an Actions run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: "platform-tools"

      - name: Install NDK
        run: sdkmanager --install "ndk;26.1.10909125"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.10.2"

      # Same binary-asset regeneration as the build workflow: the wrapper
      # jar and launcher icons are not pushed through the snapshot route.
      - name: Regenerate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2

      - name: Generate launcher icons
        run: |
          base64 -d app/art/launcher-art.b64 > /tmp/launcher-art.png
          cat > /tmp/GenIcons.java <<'JAVA_EOF'
          import java.awt.Graphics2D;
          import java.awt.RenderingHints;
          import java.awt.image.BufferedImage;
          import java.io.File;
          import javax.imageio.ImageIO;
          public class GenIcons {
              static void write(BufferedImage src, int size, File out) throws Exception {
                  BufferedImage dst = new BufferedImage(size, size, BufferedImage.TYPE_INT_ARGB);
                  Graphics2D g = dst.createGraphics();
                  g.setRenderingHint(RenderingHints.KEY_INTERPOLATION, RenderingHints.VALUE_INTERPOLATION_BICUBIC);
                  g.drawImage(src, 0, 0, size, size, null);
                  g.dispose();
                  out.getParentFile().mkdirs();
                  ImageIO.write(dst, "png", out);
              }
              public static void main(String[] args) throws Exception {
                  BufferedImage src = ImageIO.read(new File("/tmp/launcher-art.png"));
                  String base = "app/src/main/res/mipmap-";
                  String[][] legacy = {{"mdpi", "48"}, {"hdpi", "72"}, {"xhdpi", "96"}, {"xxhdpi", "144"}, {"xxxhdpi", "192"}};
                  String[][] fg = {{"mdpi", "108"}, {"hdpi", "162"}, {"xhdpi", "216"}, {"xxhdpi", "324"}, {"xxxhdpi", "432"}};
                  for (String[] sp : legacy) {
                      int size = Integer.parseInt(sp[1]);
                      write(src, size, new File(base + sp[0] + "/ic_launcher.png"));
                      write(src, size, new File(base + sp[0] + "/ic_launcher_round.png"));
                  }
                  for (String[] sp : fg) {
                      write(src, Integer.parseInt(sp[1]), new File(base + sp[0] + "/ic_launcher_foreground.png"));
                  }
              }
          }
          JAVA_EOF
          java -Djava.awt.headless=true /tmp/GenIcons.java

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK for the release
        run: cp app/build/outputs/apk/debug/app-debug.apk iVeePN-1.0.0-debug.apk

      - name: Publish to rolling latest release
        uses: softprops/action-gh-release@e7a8f85e1c67a31e6ed99a94aa25a0d08b0ea11d # v2
        with:
          tag_name: latest
          name: iVeePN latest (debug)
          body: |
            Rolling debug build of iVeePN from the latest commit on main.
            Debug signing — for testing only, not a store release.
          prerelease: true
          files: iVeePN-1.0.0-debug.apk
